[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bluesnail"
version = "0.1.0"
description = "A modular AI Agent framework for Python 3.10+"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "BlueSnail" }]
keywords = ["ai", "agent", "llm", "framework"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
web = ["fastapi>=0.115", "uvicorn[standard]>=0.32", "httpx>=0.27"]
tui = ["httpx>=0.27", "textual>=8.2.8"]

[project.scripts]
bluesnail = "bluesnail.web.server:main"
bluesnail-tui = "bluesnail.tui.app:main"

[tool.hatch.build.targets.wheel]
packages = ["bluesnail"]

[tool.hatch.build.targets.wheel.force-include]
"bluesnail/skills/packages" = "bluesnail/skills/packages"
"bluesnail/web/static" = "bluesnail/web/static"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
